# Settings every router run shares: the pinned images, the simulated vLLM pods as the pool, and fail-closed.
# The chart's default fails open (the proxy passes traffic straight through when the endpoint picker is
# unreachable), which in a benchmark would quietly measure no routing at all; here a broken picker fails requests.
# Image references are filled in from deploy/versions.env by scripts/install-router.sh.
router:
  modelServers:
    matchLabels: {app: sim}
    type: vllm
    targetPorts:
      - number: 8000
  inferencePool:
    create: true
    failureMode: FailClose
  proxy:
    enabled: true
    proxyType: envoy
    mode: sidecar
    failOpen: false
    # The chart sizes the proxy for production (4 CPUs, 8 GiB requested); a CI runner has 4 CPUs in all.
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {memory: 1Gi}
  epp:
    replicas: 1
    # Likewise 8 CPUs and 8 GiB by default. A few hundred requests a second need far less.
    resources:
      requests: {cpu: 500m, memory: 512Mi}
      limits: {memory: 2Gi}
