# precise-aware: prefix-aware with the estimate replaced by the truth. The endpoint picker subscribes to every
# pod's KV-cache events and looks each prompt's token blocks up in that index, so the score is the share of the
# prompt a pod really holds, including blocks that were evicted since. Ignores load like prefix-aware does.
router:
  epp:
    pluginsConfigFile: benchmark.yaml
    pluginsCustomConfig:
      benchmark.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: single-profile-handler
        - type: decode-filter
        # Tokenize the prompt on the render server the pods already share, so the picker hashes the same 16-token
        # blocks the pods do; the pods report their cache contents as block events, keyed by those token ids.
        - type: token-producer
          parameters:
            modelName: Qwen/Qwen2.5-1.5B-Instruct
            vllm:
              url: http://render.irb.svc:8082
        - type: endpoint-notification-source
        - type: precise-prefix-cache-producer
          parameters:
            tokenProcessorConfig:
              blockSizeTokens: 16
        - type: prefix-cache-scorer
          parameters:
            prefixMatchInfoProducerName: precise-prefix-cache-producer
        - type: max-score-picker
        dataLayer:
          sources:
          - pluginRef: endpoint-notification-source
            extractors:
            - pluginRef: precise-prefix-cache-producer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: decode-filter
          - pluginRef: prefix-cache-scorer
            weight: 1.0
          - pluginRef: max-score-picker
