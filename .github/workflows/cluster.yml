name: cluster

# Replays the same workload through each router on a real kind cluster: simulated vLLM pods with a prefix cache,
# and the llm-d Router's endpoint picker in front of them with each scoring configuration. Each router gets its own
# cluster and fresh model servers, so none inherits another's warm cache, and runs several times, because one run on
# a shared CI machine is an anecdote. A final job puts the results side by side as medians and ranges.
on:
  push:
    branches: [main]
    # A docs or committed-results change can't move a number, and would cancel a run in progress.
    paths-ignore: ["**.md", "docs/**", "results/**"]
  workflow_dispatch:
    inputs:
      workload:
        description: Workload spec in workloads/
        default: chat-rag-mix
      speedup:
        description: Replay this many times faster than the trace
        default: "2"
      replicas:
        description: Simulated vLLM pods behind each router
        default: "4"
      repeats:
        description: Runs per router, each on its own cluster (JSON list)
        default: "[1, 2, 3]"
      modes:
        description: Routers to run (JSON list)
        default: '["round-robin", "load-aware", "prefix-aware", "prefix-load-aware", "prefix-load-2x", "prefix-load-q8", "prefix-queue", "prefix-running", "prefix-active", "router-default", "prefix-active-p2", "prefix-active-a2"]'
  schedule:
    - cron: "41 3 * * 1"

defaults:
  run:
    shell: bash

permissions:
  contents: read

# A newer push replaces the push run in progress, but a dispatched experiment is never cancelled by a push: the two
# are different groups. (A push during a dispatch cancelled 48 jobs once, 29 of them finished.)
concurrency:
  group: cluster-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # GitHub starts a run's jobs in no fixed order but within minutes of each other (40 jobs in under six), so the
        # runs of one dispatch share a time window whatever their repeat number.
        repeat: ${{ fromJSON(inputs.repeats || '[1, 2, 3]') }}
        mode: ${{ fromJSON(inputs.modes || '["round-robin", "load-aware", "prefix-aware", "prefix-load-aware", "prefix-load-2x", "prefix-load-q8", "prefix-queue", "prefix-running", "prefix-active", "router-default", "prefix-active-p2", "prefix-active-a2"]') }}
    env:
      MODE: ${{ matrix.mode }}
      REPEAT: ${{ matrix.repeat }}
      WORKLOAD: ${{ inputs.workload || 'chat-rag-mix' }}
      SPEEDUP: ${{ inputs.speedup || '2' }}
      REPLICAS: ${{ inputs.replicas || '4' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Install kind and Helm
        run: |
          . deploy/versions.env
          curl -sSfL -o "$RUNNER_TEMP/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256_LINUX_AMD64}  $RUNNER_TEMP/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kind"
          name="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$name" "https://get.helm.sh/$name"
          echo "${HELM_SHA256_LINUX_AMD64}  $RUNNER_TEMP/$name" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Cluster, CRDs and the load client image
        run: scripts/cluster-up.sh
      - name: Model servers with empty caches
        run: scripts/deploy-servers.sh "$REPLICAS"
      - name: Router
        if: matrix.mode != 'round-robin'
        run: scripts/install-router.sh "$MODE"
      - name: Replay the workload
        run: scripts/run.sh "$MODE" "$WORKLOAD" out "$SPEEDUP" "$REPEAT"
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n irb get pods -o wide || true
          kubectl -n irb get events --sort-by=.lastTimestamp | tail -40 || true
          for pod in $(kubectl -n irb get pods -o name); do
            echo "=== $pod"
            kubectl -n irb get "$pod" -o jsonpath='{range .status.containerStatuses[*]}{.name}: {.state}{" last="}{.lastState}{"\n"}{end}' || true
            kubectl -n irb logs "$pod" --all-containers --tail=40 || true
            kubectl -n irb logs "$pod" --all-containers --previous --tail=40 2>/dev/null || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result-${{ matrix.mode }}-r${{ matrix.repeat }}
          path: out/
          if-no-files-found: warn

  report:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          merge-multiple: true
          path: out
      - name: Compare the routers
        env:
          # The routers this run measured, in the order given, so every router the matrix ran gets a column.
          MODES: ${{ inputs.modes || '["round-robin", "load-aware", "prefix-aware", "prefix-load-aware", "prefix-load-2x", "prefix-load-q8", "prefix-queue", "prefix-running", "prefix-active", "router-default", "prefix-active-p2", "prefix-active-a2"]' }}
        run: |
          shopt -s nullglob
          runs=()
          for mode in $(jq -r '.[]' <<<"$MODES"); do runs+=(out/"$mode"-r*.json); done
          irb report "${runs[@]}" -o out/README.md
          irb chart "${runs[@]}" --title "Routing on a kind cluster: $(jq -r '.cluster.model_server.replicas' "${runs[0]}") simulated vLLM pods, same trace" -o out/chart.svg
          cat out/README.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison
          path: out/
