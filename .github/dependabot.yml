# Pinned action commits and the PyYAML floor stay safe only while they are kept current: Dependabot opens weekly update
# pull requests. Each update waits 14 days after a release, the same age rule `irb versions` applies to the pins in
# deploy/versions.env, so a compromised or withdrawn release is usually found before it is proposed. Security updates
# are not delayed. The Dockerfile's base image is pinned by digest through PYTHON_IMAGE in deploy/versions.env, which
# Dependabot cannot follow, so it is not listed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
